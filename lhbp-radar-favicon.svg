<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <clipPath id="clip"><rect x="6" y="6" width="244" height="244" rx="38"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="44" fill="#07090a"/>
  <rect x="6" y="6" width="244" height="244" rx="38" fill="#0b0e10" stroke="#34393d" stroke-width="6"/>

  <g clip-path="url(#clip)">
    <!-- subtle map/terrain -->
    <g fill="none" stroke="#242a2d" stroke-width="1.2" opacity=".8">
      <path d="M-10 74 C32 48 55 67 82 53 S133 22 165 48 220 72 270 39"/>
      <path d="M-20 188 C25 157 42 184 69 164 S118 126 147 145 207 177 275 132"/>
      <path d="M14 20 C45 43 53 86 83 104 S126 117 144 152 185 206 238 220"/>
      <path d="M30 250 C55 212 91 207 112 184 S151 139 182 122 224 92 264 105"/>
    </g>

    <!-- airspace -->
    <g fill="#7d160f" fill-opacity=".22" stroke="#ff3b30" stroke-width="2">
      <path d="M-15 69 L42 55 L60 72 L55 112 L76 129 L55 159 L27 148 L7 177 L-18 166 Z"/>
      <path d="M181 -8 L269 8 L262 72 L226 84 L202 64 L168 45 L173 14 Z"/>
      <path d="M-5 205 L29 184 L58 198 L68 231 L42 268 L3 252 Z"/>
    </g>

    <!-- flight routes -->
    <g fill="none" stroke="#e6e8e9" stroke-width="3" stroke-dasharray="9 7" opacity=".95">
      <path d="M-5 57 L53 86 L104 118 L151 153 L262 214"/>
      <path d="M48 -8 L64 47 L87 91 L111 125 L143 176 L163 264"/>
      <path d="M-10 177 L38 160 L88 147 L138 157 L204 184 L266 178"/>
    </g>

    <!-- airport layout -->
    <g fill="none" stroke="#f5f6f6" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="5" d="M91 112 L116 137 L164 100 L194 128"/>
      <path stroke-width="4" d="M106 125 L84 99 L69 82"/>
      <path stroke-width="4" d="M143 116 L169 145 L195 171"/>
      <path stroke-width="3" d="M116 137 L133 151 L151 145"/>
      <path stroke-width="3" d="M164 100 L181 84"/>
      <path stroke-width="3" d="M164 100 L181 116"/>
    </g>

    <!-- runway ends -->
    <g fill="none" stroke="#ffffff" stroke-width="4">
      <path d="M62 75 L75 88"/>
      <path d="M188 121 L201 134"/>
    </g>

    <!-- waypoints -->
    <g fill="#0b0e10" stroke="#f4f5f5" stroke-width="2">
      <path d="M50 83 l6 10 h-12 z"/>
      <path d="M107 121 l6 10 h-12 z"/>
      <path d="M198 181 l6 10 h-12 z"/>
      <path d="M156 150 l6 10 h-12 z"/>
    </g>

    <!-- aircraft -->
    <g fill="#8cff00" stroke="#8cff00" filter="url(#glow)">
      <path d="M38 36 l7 12 15 5 -15 4 -7 13 -3-13 -13-5 13-4z"/>
      <path d="M137 72 l6 11 13 5 -13 4 -6 13 -4-13 -12-4 12-5z"/>
      <path d="M209 125 l6 12 14 5 -14 4 -6 13 -4-13 -13-4 13-5z"/>
      <path d="M105 187 l6 12 14 5 -14 4 -6 13 -4-13 -13-4 13-5z"/>
    </g>

    <!-- green trails -->
    <g fill="none" stroke="#8cff00" stroke-width="3" stroke-dasharray="6 6">
      <path d="M8 22 Q27 28 38 36"/>
      <path d="M118 57 Q129 63 137 72"/>
      <path d="M235 111 Q221 119 209 125"/>
      <path d="M101 229 Q101 207 105 187"/>
    </g>
  </g>
</svg>