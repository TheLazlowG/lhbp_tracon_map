<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADS-B.fi Direct API Test</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:30px}button{padding:8px 14px}#status{margin:15px 0}pre{background:#1b1b1b;padding:15px;overflow:auto;max-height:70vh}</style>
</head>
<body>
<h1>ADS-B.fi Direct API Test</h1>
<p>This page requests ADS-B.fi directly from the browser. No proxy/server is used.</p>
<button id="test">Test now</button>
<div id="status">Waiting...</div>
<pre id="output"></pre>
<script>
const LAT=47.4369,LON=19.2556,DIST=150;
const status=document.getElementById('status'),output=document.getElementById('output');
async function testApi(){
 const url=`https://opendata.adsb.fi/api/v3/lat/${LAT}/lon/${LON}/dist/${DIST}`;
 status.textContent='Requesting ADS-B.fi...'; output.textContent='';
 try{
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  const data=await response.json();
  status.textContent=`SUCCESS — received ${Array.isArray(data.ac)?data.ac.length:0} aircraft`;
  output.textContent=JSON.stringify(data,null,2);
 }catch(error){
  status.textContent=`FAILED — ${error.message}`;
  output.textContent='If the browser console shows a CORS error, ADS-B.fi cannot be accessed directly from GitHub Pages.';
  console.error('ADS-B.fi test failed:',error);
 }
}
document.getElementById('test').addEventListener('click',testApi); testApi();
</script>
</body></html>
