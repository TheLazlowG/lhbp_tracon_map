<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hungary Air Traffic Map</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div id="cesiumContainer" aria-label="Hungary air traffic map"></div>
      <div id="datablocks" aria-live="polite"></div>

      <header class="topbar">
        <div class="brand">LH AIR TRAFFIC</div>
        <button class="mode-button active" data-mode="2D">2D</button>
        <button class="mode-button" data-mode="3D">3D</button>
        <button class="mode-button" data-mode="tower">TOWER</button>
        <label class="toggle"><input id="labelsToggle" type="checkbox" /> MAP LABELS</label>
        <label class="toggle"><input id="tracksToggle" type="checkbox" checked /> TRACKS</label>
        <label class="toggle"><input id="datablocksToggle" type="checkbox" checked /> DATABLOCKS</label>
        <label class="range-control">VERTICAL <output id="verticalValue">1×</output>
          <input id="verticalExaggeration" type="range" min="1" max="20" value="1" step="1" />
        </label>
        <div class="status"><span id="statusDot"></span><span id="feedStatus">Starting…</span></div>
      </header>

      <aside class="left-panel panel">
        <label class="search-label" for="searchInput">SEARCH</label>
        <input id="searchInput" autocomplete="off" placeholder="CALLSIGN / ICAO / PLACE" />
        <div id="searchResults" class="search-results"></div>
        <hr />
        <div class="metric"><span>TRACKED</span><strong id="trafficCount">0</strong></div>
        <div class="metric"><span>UPDATE</span><strong id="lastUpdate">—</strong></div>
        <p class="hint">Click a target to select it. Drag its datablock to reposition it.</p>
      </aside>

      <aside id="towerPanel" class="tower-panel panel" hidden>
        <div class="panel-title">LHBP TOWER PTZ</div>
        <div class="ptz-grid">
          <button data-ptz="up">▲</button><button data-ptz="zoom-in">＋</button>
          <button data-ptz="left">◀</button><button data-ptz="home">●</button><button data-ptz="right">▶</button>
          <button data-ptz="down">▼</button><button data-ptz="zoom-out">−</button>
        </div>
        <p class="hint">Tower mode keeps the camera at the configured tower position.</p>
      </aside>

      <aside id="detailsPanel" class="details-panel panel" hidden>
        <button id="closeDetails" class="close" aria-label="Close details">×</button>
        <div class="panel-title" id="selectedTitle">TARGET</div>
        <dl id="selectedDetails"></dl>
      </aside>

      <footer class="footer">LIVE DATA: airplanes.live · BASEMAP: © CARTO © OpenStreetMap contributors · NOT FOR NAVIGATION</footer>
    </main>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Cesium.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
